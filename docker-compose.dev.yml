# Local development infrastructure (docs/architecture/11-engineering-foundation.md).
# Production uses managed Postgres and Upstash Redis; these containers are
# wire-compatible stand-ins for development and CI service containers.
#
#   docker compose -f docker-compose.dev.yml up -d

name: resfolio-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host 15432: leaves room for a natively installed Postgres on 5432.
      # NOT 5433 — Windows (Hyper-V/WinNAT) reserves the 5433-5532 range, so
      # binding anything in it fails with "socket access forbidden". Check with
      # `netsh interface ipv4 show excludedportrange protocol=tcp`.
      - "15432:5432"
    environment:
      POSTGRES_USER: resfolio
      POSTGRES_PASSWORD: resfolio
      POSTGRES_DB: resfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
